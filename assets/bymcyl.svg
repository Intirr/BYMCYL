      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#c4cfe2"/>
    </linearGradient>
    <radialGradient id="by-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0"/>
