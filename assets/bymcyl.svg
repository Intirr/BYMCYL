    <rect x="15" y="11" width="6" height="6" rx="1" fill="#1b2740"/>
    <rect x="16.5" y="12" width="3" height="4" fill="#ffe9b0"/>
    <polygon points="14,11 22,11 20,7.5 16,7.5" fill="#e0606a"/>
    <polygon points="14,17 22,17 24,38 12,38" fill="url(#by-tower)"/>
    <polygon points="14,17 22,17 22.6,23 13.4,23" fill="#e0606a"/>
