<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Pharus — Biblioteca">
  <defs>
    <linearGradient id="ph-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd479" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ph-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98c"/>
      <stop offset=".55" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#e8862f"/>
    </linearGradient>
    <linearGradient id="ph-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#c4cfe2"/>
    </linearGradient>
    <radialGradient id="ph-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset=".45" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== Lighthouse + neural icon ===== -->
  <g transform="translate(0,0)">
    <!-- light beams -->
    <g opacity=".9">
      <polygon points="92,58 16,8 4,40" fill="url(#ph-beam)"/>
      <polygon points="92,58 168,8 180,40" fill="url(#ph-beam)"/>
      <polygon points="92,58 200,52 200,78" fill="url(#ph-beam)" opacity=".7"/>
    </g>

    <!-- neural network in/around the beam -->
    <g stroke="#4fd6c0" stroke-width="1.4" opacity=".75">
      <line x1="92" y1="58" x2="44" y2="26"/>
      <line x1="44" y1="26" x2="22" y2="46"/>
      <line x1="92" y1="58" x2="140" y2="26"/>
      <line x1="140" y1="26" x2="170" y2="40"/>
      <line x1="92" y1="58" x2="158" y2="62"/>
      <line x1="44" y1="26" x2="140" y2="26"/>
      <line x1="158" y1="62" x2="170" y2="40"/>
    </g>
    <g fill="#7ff0e0">
      <circle cx="44" cy="26" r="3.4"/>
      <circle cx="22" cy="46" r="2.8"/>
      <circle cx="140" cy="26" r="3.4"/>
      <circle cx="170" cy="40" r="2.8"/>
      <circle cx="158" cy="62" r="3"/>
    </g>

    <!-- glow halo around lantern -->
    <circle cx="92" cy="58" r="26" fill="url(#ph-glow)"/>

    <!-- lantern room -->
    <rect x="83" y="50" width="18" height="16" rx="2" fill="#1b2740"/>
    <rect x="86" y="52" width="12" height="12" rx="1.5" fill="#ffe9b0"/>
    <polygon points="80,50 104,50 99,42 85,42" fill="#e0606a"/>
    <circle cx="92" cy="40" r="2.4" fill="#ffd479"/>

    <!-- tower -->
    <polygon points="80,66 104,66 112,160 72,160" fill="url(#ph-tower)"/>
    <!-- stripes -->
    <polygon points="80,66 104,66 105.6,84 78.4,84" fill="#e0606a" opacity=".92"/>
    <polygon points="76.8,104 107.2,104 108.8,122 75.2,122" fill="#e0606a" opacity=".92"/>
    <polygon points="73.6,142 110.4,142 112,160 72,160" fill="#e0606a" opacity=".92"/>
    <!-- gallery / base -->
    <rect x="68" y="64" width="48" height="5" rx="2.5" fill="#1b2740"/>
    <rect x="64" y="160" width="56" height="10" rx="3" fill="#2a3a57"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="210" y="108" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif"
        font-size="86" font-weight="800" letter-spacing="2" fill="url(#ph-word)">PHARUS</text>
  <text x="214" y="146" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif"
        font-size="20" font-weight="600" letter-spacing="11" fill="#4fd6c0">BIBLIOTECA</text>
</svg>
