<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Biblioteca Práctica — 200 recursos">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b942"/><stop offset="1" stop-color="#e8862f"/>
    </linearGradient>
    <linearGradient id="amberD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a52f"/><stop offset="1" stop-color="#cf7220"/>
    </linearGradient>
    <radialGradient id="g1" cx="18%" cy="0%" r="60%">
      <stop offset="0" stop-color="#f5b942" stop-opacity=".18"/><stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="8%" r="55%">
      <stop offset="0" stop-color="#5b8def" stop-opacity=".20"/><stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="115%" r="60%">
      <stop offset="0" stop-color="#3ec6c0" stop-opacity=".16"/><stop offset="1" stop-color="#3ec6c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f1115"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>
  <rect x="20" y="20" width="1160" height="590" rx="26" fill="none" stroke="#2c3140" stroke-width="2"/>

  <!-- icon -->
  <g transform="translate(600,150) scale(3.1)" >
    <g transform="translate(-32,-26)">
      <path d="M32 5 L35 13 L43 16 L35 19 L32 27 L29 19 L21 16 L29 13 Z" fill="#3ec6c0"/>
      <path d="M32 31 L11 28 L11 47 L32 49 Z" fill="url(#amber)"/>
      <path d="M32 31 L53 28 L53 47 L32 49 Z" fill="url(#amberD)"/>
      <line x1="32" y1="31" x2="32" y2="49" stroke="#0f1115" stroke-opacity=".30" stroke-width="1.5"/>
    </g>
  </g>

  <text x="600" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="78" font-weight="800" letter-spacing="-1" fill="#e8eaf0">Biblioteca <tspan fill="#f5b942">Práctica</tspan></text>
  <text x="600" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="29" font-weight="500" fill="#9aa3b5">Resúmenes accionables de libros y ciencia aplicada</text>

  <!-- stat chips -->
  <g font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="25" font-weight="700">
    <g transform="translate(372,486)">
      <rect width="196" height="58" rx="29" fill="#181b22" stroke="#2c3140"/>
      <text x="98" y="38" text-anchor="middle" fill="#e8eaf0">📚 200 recursos</text>
    </g>
    <g transform="translate(584,486)">
      <rect width="244" height="58" rx="29" fill="#181b22" stroke="#2c3140"/>
      <text x="122" y="38" text-anchor="middle" fill="#e8eaf0">151 libros · 49 estudios</text>
    </g>
  </g>
  <text x="600" y="582" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="20" fill="#5e6880">8 categorías · hábitos · foco · aprendizaje · decisiones · bienestar</text>
</svg>
